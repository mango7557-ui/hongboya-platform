<!DOCTYPE html>
<html lang="ko">
<head>
    <script src="./web-preview.js"></script>
<meta charset="UTF-8">
<title>Gemini API 완전 테스트</title>
<style>
  body { font-family: sans-serif; background: #f1f5f9; padding: 20px; margin: 0; }
  .card { background: white; border-radius: 16px; padding: 24px; max-width: 760px; margin: auto; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  h2 { margin: 0 0 4px; color: #4f46e5; }
  .sub { color: #6b7280; font-size: 12px; margin-bottom: 16px; }
  input { width:100%; padding:10px 14px; border:1.5px solid #d1d5db; border-radius:10px; font-size:13px; box-sizing:border-box; margin-bottom:10px; font-family:monospace; }
  .btn { width:100%; padding:11px; background:linear-gradient(135deg,#4f46e5,#7c3aed); color:white; border:none; border-radius:10px; font-size:14px; font-weight:bold; cursor:pointer; margin-bottom:8px; }
  .btn:disabled { opacity:0.5; cursor:not-allowed; }
  .btn.green { background:linear-gradient(135deg,#16a34a,#15803d); }
  .row { display:flex; align-items:flex-start; gap:8px; padding:8px 12px; border-radius:8px; margin-bottom:5px; font-size:12px; border:1px solid #e5e7eb; }
  .row.ok   { background:#f0fdf4; border-color:#86efac; }
  .row.fail { background:#fef2f2; border-color:#fca5a5; }
  .row.wait { background:#fffbeb; border-color:#fde68a; }
  .name { font-weight:bold; min-width:200px; flex-shrink:0; }
  .msg  { color:#6b7280; font-size:11px; word-break:break-all; }
  .row.ok   .msg { color:#16a34a; }
  .row.fail .msg { color:#dc2626; }
  .summary { margin-top:14px; background:#eff6ff; border:1.5px solid #93c5fd; border-radius:12px; padding:14px; }
  .tag { display:inline-block; background:#dbeafe; color:#1d4ed8; border-radius:6px; padding:3px 10px; font-size:12px; font-weight:bold; margin:2px; }
  .warn { background:#fef9c3; border:1.5px solid #fde047; border-radius:10px; padding:12px 16px; font-size:12px; color:#854d0e; margin-bottom:12px; }
  #log { background:#1e293b; color:#94a3b8; border-radius:10px; padding:12px; font-size:11px; font-family:monospace; margin-top:12px; max-height:160px; overflow-y:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<div class="card">
  <h2>🔑 Gemini API 완전 테스트</h2>
  <p class="sub">v1 / v1beta / v1alpha 모든 API 버전 × 최신 모델 전수 조회</p>

  <div class="warn">
    ⚠️ <b>한국 신규 키 이슈:</b> Google이 2024년 말부터 한국 신규 무료 키에서 gemini-1.5/2.0 계열을 차단하고 있습니다.<br>
    → <b>gemini-2.5 계열 또는 v1alpha API</b>로 우회 가능합니다. 아래에서 자동으로 찾아드립니다.
  </div>

  <input type="password" id="apiKey" placeholder="AIza...로 시작하는 API 키" value="" />
  <button class="btn" id="startBtn" onclick="startTest()">🚀 전체 테스트 시작 (v1 + v1beta + v1alpha)</button>

  <div id="result"></div>
  <div id="log"></div>
</div>

<script>
// API 버전 × 모델 전체 조합 테스트
const TESTS = [
  // v1alpha - 최신 실험 모델
  { api:'v1alpha', model:'gemini-2.5-pro-preview-05-06' },
  { api:'v1alpha', model:'gemini-2.5-flash-preview-05-20' },
  { api:'v1alpha', model:'gemini-2.5-flash-preview-04-17' },
  { api:'v1alpha', model:'gemini-2.0-flash' },
  { api:'v1alpha', model:'gemini-2.0-flash-lite' },
  { api:'v1alpha', model:'gemini-1.5-flash' },
  { api:'v1alpha', model:'gemini-1.5-pro' },
  // v1beta
  { api:'v1beta', model:'gemini-2.5-pro-preview-05-06' },
  { api:'v1beta', model:'gemini-2.5-flash-preview-05-20' },
  { api:'v1beta', model:'gemini-2.5-flash-preview-04-17' },
  { api:'v1beta', model:'gemini-2.0-flash' },
  { api:'v1beta', model:'gemini-2.0-flash-lite' },
  { api:'v1beta', model:'gemini-1.5-flash' },
  { api:'v1beta', model:'gemini-1.5-pro' },
  // v1
  { api:'v1', model:'gemini-2.5-pro-preview-05-06' },
  { api:'v1', model:'gemini-2.5-flash-preview-05-20' },
  { api:'v1', model:'gemini-2.0-flash' },
  { api:'v1', model:'gemini-2.0-flash-lite' },
  { api:'v1', model:'gemini-1.5-flash' },
  { api:'v1', model:'gemini-1.5-pro' },
];

let logEl;
function addLog(msg) {
  if (!logEl) logEl = document.getElementById('log');
  logEl.textContent += msg + '\n';
  logEl.scrollTop = logEl.scrollHeight;
}

async function startTest() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key || !key.startsWith('AIza')) { alert('올바른 API 키를 입력하세요'); return; }

  const btn = document.getElementById('startBtn');
  const result = document.getElementById('result');
  const log = document.getElementById('log');
  btn.disabled = true; btn.textContent = '⏳ 테스트 중...';
  result.innerHTML = ''; log.textContent = '';

  const working = [];

  for (const { api, model } of TESTS) {
    const label = `[${api}] ${model}`;
    const div = document.createElement('div');
    div.className = 'row wait';
    div.innerHTML = `<span>⏳</span><span class="name">${label}</span><span class="msg">테스트 중...</span>`;
    result.appendChild(div);

    try {
      const url = `https://generativelanguage.googleapis.com/${api}/models/${model}:generateContent?key=${key}`;
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ role:'user', parts:[{ text:'hi' }] }] }),
        signal: AbortSignal.timeout(10000)
      });

      const data = await res.json().catch(() => ({}));
      const errMsg = data?.error?.message || '';

      if (res.ok) {
        div.className = 'row ok';
        div.innerHTML = `<span>✅</span><span class="name">${label}</span><span class="msg">정상 작동!</span>`;
        working.push({ api, model });
        addLog(`✅ OK: ${label}`);
      } else {
        div.className = 'row fail';
        div.innerHTML = `<span>❌</span><span class="name">${label}</span><span class="msg">${errMsg.substring(0,100)}</span>`;
        addLog(`❌ FAIL [${res.status}]: ${label} → ${errMsg.substring(0,80)}`);
      }
    } catch(e) {
      div.className = 'row fail';
      div.innerHTML = `<span>❌</span><span class="name">${label}</span><span class="msg">${e.message}</span>`;
      addLog(`❌ ERR: ${label} → ${e.message}`);
    }
  }

  // 요약
  const sum = document.createElement('div');
  if (working.length > 0) {
    sum.className = 'summary';
    sum.innerHTML = `
      <b style="color:#1d4ed8">✅ 사용 가능한 조합 ${working.length}개 발견!</b><br><br>
      ${working.map(w => `<span class="tag">[${w.api}] ${w.model}</span>`).join('')}
      <br><br>
      <button class="btn green" onclick='applyBest(${JSON.stringify(working)}, "${key}")'>
        🔧 최적 모델로 챗봇 & 관리자 페이지 자동 적용
      </button>`;
  } else {
    sum.innerHTML = `<div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:10px;padding:14px;color:#991b1b;font-size:13px;">
      ❌ 모든 조합에서 실패했습니다.<br><br>
      <b>해결방법:</b><br>
      1. <a href="https://aistudio.google.com/apikey" target="_blank" style="color:#4f46e5">Google AI Studio</a>에서 <b>새 API 키 발급</b><br>
      2. VPN(미국/일본 서버) 사용 후 키 발급<br>
      3. Google Cloud Console에서 결제 계정 연결
    </div>`;
  }
  result.appendChild(sum);

  btn.disabled = false; btn.textContent = '🔄 다시 테스트';
}

function applyBest(working, key) {
  // 가장 좋은 조합 선택 (v1alpha > v1beta > v1, 최신 모델 우선)
  const best = working[0];
  localStorage.setItem('gemini_api_key', key);
  localStorage.setItem('gemini_api_version', best.api);
  localStorage.setItem('gemini_best_model', best.model);
  localStorage.setItem('gemini_working_models', JSON.stringify(working.map(w => w.model)));
  alert(`✅ 적용 완료!\n\nAPI 버전: ${best.api}\n최적 모델: ${best.model}\n\nchatbot.html과 admin.html에서 사용하세요!`);
  window.location.href = 'chatbot.html';
}
</script>
</body>
</html>
