<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>Gemini 모델 확인</title>
<style>
  body { font-family: sans-serif; padding: 30px; background: #f5f5f5; }
  .box { background: white; border-radius: 12px; padding: 24px; max-width: 800px; margin: auto; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  h2 { margin-top: 0; color: #4f46e5; }
  input { width: 100%; padding: 10px 14px; border: 1.5px solid #d1d5db; border-radius: 8px; font-size: 14px; box-sizing: border-box; margin-bottom: 12px; }
  button { padding: 10px 24px; background: #4f46e5; color: white; border: none; border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: bold; }
  button:hover { background: #4338ca; }
  #result { margin-top: 20px; }
  .model-item { padding: 10px 14px; border-radius: 8px; margin-bottom: 8px; font-size: 13px; border: 1px solid #e5e7eb; }
  .ok   { background: #f0fdf4; border-color: #86efac; color: #166534; }
  .fail { background: #fef2f2; border-color: #fca5a5; color: #991b1b; }
  .loading { color: #6b7280; }
  pre { background: #1e293b; color: #e2e8f0; padding: 16px; border-radius: 8px; overflow-x: auto; font-size: 12px; }
</style>
</head>
<body>
<div class="box">
  <h2>🔍 Gemini API 사용 가능 모델 확인</h2>
  <p style="font-size:13px;color:#6b7280;">API 키를 입력하면 실제로 응답 가능한 모델을 자동으로 확인합니다.</p>
  <input type="password" id="apiKey" placeholder="AIza...로 시작하는 Gemini API 키" />
  <button onclick="checkModels()">모델 확인하기</button>
  <div id="result"></div>
</div>

<script>
const MODELS_TO_TEST = [
  'gemini-2.5-pro-preview-05-06',
  'gemini-2.5-flash-preview-04-17',
  'gemini-2.5-pro-exp-03-25',
  'gemini-2.0-flash',
  'gemini-2.0-flash-lite',
  'gemini-2.0-flash-latest',
  'gemini-1.5-flash',
  'gemini-1.5-flash-latest',
  'gemini-1.5-flash-8b',
  'gemini-1.5-flash-8b-latest',
  'gemini-1.5-pro',
  'gemini-1.5-pro-latest',
  'gemini-pro',
];

async function checkModels() {
  const key = document.getElementById('apiKey').value.trim();
  if (!key) { alert('API 키를 입력해주세요'); return; }

  const result = document.getElementById('result');
  result.innerHTML = '<p class="loading">⏳ 모델 목록 조회 중...</p>';

  // 1. ListModels API로 사용 가능한 모델 목록 먼저 조회
  let availableModels = [];
  try {
    const listRes = await fetch(`https://generativelanguage.googleapis.com/v1beta/models?key=${key}`);
    const listData = await listRes.json();
    if (listData.models) {
      availableModels = listData.models
        .filter(m => m.supportedGenerationMethods?.includes('generateContent'))
        .map(m => m.name.replace('models/', ''));
    }
  } catch(e) {}

  // 2. 직접 테스트
  result.innerHTML = `
    <h3 style="font-size:15px;font-weight:bold;margin-bottom:12px;">📋 테스트 결과</h3>
    <div id="model-list"></div>
    <div id="summary" style="margin-top:16px;"></div>
  `;
  const listEl = document.getElementById('model-list');
  const working = [];

  for (const model of MODELS_TO_TEST) {
    const el = document.createElement('div');
    el.className = 'model-item loading';
    el.innerHTML = `⏳ 테스트 중... <b>${model}</b>`;
    listEl.appendChild(el);

    try {
      const res = await fetch(
        `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${key}`,
        {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ role:'user', parts:[{ text:'hi' }] }] }),
          signal: AbortSignal.timeout(8000)
        }
      );
      if (res.ok) {
        el.className = 'model-item ok';
        el.innerHTML = `✅ <b>${model}</b> — 정상 작동`;
        working.push(model);
      } else {
        const err = await res.json().catch(() => ({}));
        const msg = err?.error?.message || `HTTP ${res.status}`;
        el.className = 'model-item fail';
        el.innerHTML = `❌ <b>${model}</b> — ${msg}`;
      }
    } catch(e) {
      el.className = 'model-item fail';
      el.innerHTML = `❌ <b>${model}</b> — ${e.message}`;
    }
  }

  // 요약
  const summaryEl = document.getElementById('summary');
  if (working.length > 0) {
    summaryEl.innerHTML = `
      <div style="background:#eff6ff;border:1.5px solid #93c5fd;border-radius:10px;padding:16px;">
        <p style="font-weight:bold;color:#1d4ed8;margin:0 0 8px;">✅ 사용 가능한 모델 (${working.length}개)</p>
        <pre>${JSON.stringify(working, null, 2)}</pre>
        <p style="font-size:12px;color:#6b7280;margin:8px 0 0;">위 목록을 개발자에게 공유해주세요!</p>
      </div>`;
  } else {
    summaryEl.innerHTML = `<div style="background:#fef2f2;border:1.5px solid #fca5a5;border-radius:10px;padding:16px;color:#991b1b;">❌ 사용 가능한 모델이 없습니다. API 키를 확인해주세요.</div>`;
  }
}
</script>
</body>
</html>
